<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LAC Ticket Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {box-sizing:border-box}
    html,body {width:100%;margin:0;padding:0;overflow-x:hidden;-webkit-text-size-adjust:100%}
    body {font-family:Arial,sans-serif;text-align:center;padding:20px 12px;font-size:20px}
    h2 {font-size:27px}
    button {width:100%;max-width:400px;padding:18px;font-size:22px;background:#0875d1;color:white;border:0;border-radius:10px;cursor:pointer}
    button:disabled {opacity:.6}
    #reader {width:100%;max-width:450px;margin:20px auto}
    #result {max-width:450px;margin:20px auto;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <h2>LAC Ticket Scanner</h2>
  <button id="start" onclick="startScanner()">SCAN QR CODE</button>
  <div id="reader"></div>
  <div id="result" role="status"></div>
  <script>
    let scanner=null;
    let processing=false;
    async function startScanner() {
      const result=document.getElementById('result');
      const button=document.getElementById('start');
      button.disabled=true;
      processing=false;
      result.textContent='Starting camera...';
      try {
        scanner=new Html5Qrcode('reader');
        await scanner.start(
          {facingMode:'environment'},
          {fps:10,qrbox:{width:250,height:250}},
          async decodedText => {
            if(processing)return;
            processing=true;
            // The QR text is sent verbatim; the parent app verifies the ticket and PIN.
            const raw=String(decodedText||'').trim();
            result.textContent='QR code captured. Returning to check-in...';
            try {await scanner.stop();}catch(e){}
            try {scanner.clear();}catch(e){}
            scanner=null;
            if(window.opener && !window.opener.closed){
              window.opener.postMessage({type:'LAC_QR_SCAN',raw:raw},'*');
              setTimeout(()=>window.close(),500);
            } else {
              result.textContent='Return to the LAC check-in page and tap Alternate QR Camera to scan.';
              button.disabled=false;
              processing=false;
            }
          },
          ()=>{}
        );
        result.textContent='Point your camera at an LAC ticket QR code.';
      } catch(error) {
        result.textContent='Camera error: '+(error.message||error);
        button.disabled=false;
        processing=false;
        scanner=null;
      }
    }
  </script>
</body>
</html>
